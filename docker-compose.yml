services:
  governance-api:
    build:
      context: ./backend/governance-api
      dockerfile: Dockerfile
    image: family-dollar-governance-api:local
    container_name: family-dollar-governance-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  intake-portal:
    build:
      context: ./frontend/intake-portal
      dockerfile: Dockerfile
    image: family-dollar-intake-portal:local
    container_name: family-dollar-intake-portal
    ports:
      - "8080:8080"
    depends_on:
      governance-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
